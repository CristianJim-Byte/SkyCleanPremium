<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="drone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="spray" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4"/>
  <!-- Drone body -->
  <ellipse cx="256" cy="210" rx="36" ry="20" fill="#e2e8f0"/>
  <ellipse cx="256" cy="210" rx="28" ry="14" fill="#cbd5e1"/>
  <!-- Drone arms -->
  <line x1="220" y1="210" x2="140" y2="180" stroke="url(#drone)" stroke-width="10" stroke-linecap="round"/>
  <line x1="292" y1="210" x2="372" y2="180" stroke="url(#drone)" stroke-width="10" stroke-linecap="round"/>
  <line x1="220" y1="215" x2="150" y2="240" stroke="url(#drone)" stroke-width="10" stroke-linecap="round"/>
  <line x1="292" y1="215" x2="362" y2="240" stroke="url(#drone)" stroke-width="10" stroke-linecap="round"/>
  <!-- Propellers -->
  <ellipse cx="140" cy="180" rx="40" ry="8" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="372" cy="180" rx="40" ry="8" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="150" cy="240" rx="38" ry="8" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="362" cy="240" rx="38" ry="8" fill="#38bdf8" opacity="0.6"/>
  <!-- Propeller centers -->
  <circle cx="140" cy="180" r="6" fill="#e2e8f0"/>
  <circle cx="372" cy="180" r="6" fill="#e2e8f0"/>
  <circle cx="150" cy="240" r="6" fill="#e2e8f0"/>
  <circle cx="362" cy="240" r="6" fill="#e2e8f0"/>
  <!-- Camera/nozzle -->
  <rect x="246" y="224" width="20" height="16" rx="3" fill="#94a3b8"/>
  <!-- Water spray -->
  <path d="M256 244 L236 340 Q246 360 256 365 Q266 360 276 340 Z" fill="url(#spray)" opacity="0.7"/>
  <path d="M256 244 L244 310 Q250 325 256 330 Q262 325 268 310 Z" fill="url(#spray)" opacity="0.5"/>
  <!-- Water droplets -->
  <circle cx="240" cy="350" r="5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="272" cy="345" r="4" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="250" cy="365" r="3.5" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="265" cy="358" r="3" fill="#7dd3fc" opacity="0.5"/>
  <!-- Sparkle accents -->
  <path d="M400 120 L404 130 L414 134 L404 138 L400 148 L396 138 L386 134 L396 130 Z" fill="white" opacity="0.7"/>
  <path d="M120 300 L123 307 L130 310 L123 313 L120 320 L117 313 L110 310 L117 307 Z" fill="white" opacity="0.5"/>
  <!-- SC initials subtle -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="64" fill="white" opacity="0.9" letter-spacing="8">SC</text>
</svg>
